<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- A tiny inline SVG icon for the browser tab, so no image file is needed. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <!-- The display: the small line shows the calculation, the big line the current number. -->
        <div class="display">
            <p id="expression" class="expression"></p>
            <!-- role="status" + aria-live let screen readers announce results. -->
            <p id="current" class="current" role="status" aria-live="polite">0</p>
        </div>

        <!-- Every key is a <button>. data-action says what kind of key it is and data-value what it holds.
             script.js listens for clicks on the whole grid (event delegation), not on each button. -->
        <div id="keys" class="keys">
            <button data-action="clear" class="key fn">AC</button>
            <button data-action="sign" class="key fn" aria-label="Plus or minus">±</button>
            <button data-action="percent" class="key fn">%</button>
            <button data-action="operator" data-value="/" class="key op" aria-label="Divide">÷</button>

            <button data-action="digit" data-value="7" class="key">7</button>
            <button data-action="digit" data-value="8" class="key">8</button>
            <button data-action="digit" data-value="9" class="key">9</button>
            <button data-action="operator" data-value="*" class="key op" aria-label="Multiply">×</button>

            <button data-action="digit" data-value="4" class="key">4</button>
            <button data-action="digit" data-value="5" class="key">5</button>
            <button data-action="digit" data-value="6" class="key">6</button>
            <button data-action="operator" data-value="-" class="key op" aria-label="Subtract">−</button>

            <button data-action="digit" data-value="1" class="key">1</button>
            <button data-action="digit" data-value="2" class="key">2</button>
            <button data-action="digit" data-value="3" class="key">3</button>
            <button data-action="operator" data-value="+" class="key op" aria-label="Add">+</button>

            <button data-action="delete" class="key fn" aria-label="Delete last digit">⌫</button>
            <button data-action="digit" data-value="0" class="key">0</button>
            <button data-action="decimal" class="key">.</button>
            <button data-action="equals" class="key equals">=</button>
        </div>

        <p class="hint">Works with your keyboard: 0–9 . + − * / Enter Backspace Esc %</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
