<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- A tiny inline SVG icon for the browser tab, so no image file is needed. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <h1>Expense Tracker</h1>
            <!-- type="month" gives a month picker; the value looks like "2026-09". -->
            <label class="month">
                <span class="visually-hidden">Month</span>
                <input id="month" type="month">
            </label>
        </header>

        <!-- Summary cards. -->
        <section class="summary">
            <div class="card balance">
                <span>Balance</span>
                <strong id="balance">₱0.00</strong>
            </div>
            <div class="card income">
                <span>Income</span>
                <strong id="income">₱0.00</strong>
            </div>
            <div class="card expense">
                <span>Expenses</span>
                <strong id="expense">₱0.00</strong>
            </div>
        </section>

        <div class="columns">
            <!-- Left column: the form and the chart. -->
            <div>
                <section class="panel">
                    <h2>Add transaction</h2>
                    <form id="form" class="form" novalidate>
                        <!-- A two-option toggle made from radio buttons. -->
                        <div class="type-toggle" role="radiogroup" aria-label="Type">
                            <label><input type="radio" name="type" value="expense" checked><span>Expense</span></label>
                            <label><input type="radio" name="type" value="income"><span>Income</span></label>
                        </div>

                        <label>
                            Description
                            <input id="description" name="description" type="text" maxlength="40" placeholder="e.g. Groceries" required>
                        </label>

                        <div class="row">
                            <label>
                                Amount (₱)
                                <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" required>
                            </label>
                            <label>
                                Date
                                <input id="date" name="date" type="date" required>
                            </label>
                        </div>

                        <label>
                            Category
                            <!-- The options change with the type; script.js fills them in. -->
                            <select id="category" name="category"></select>
                        </label>

                        <p id="form-error" class="form-error" aria-live="polite"></p>
                        <button type="submit" class="btn">Add</button>
                    </form>
                </section>

                <section class="panel">
                    <h2>Spending by category</h2>
                    <!-- <canvas> is a blank drawing surface. script.js draws the donut chart on it. -->
                    <div class="chart-wrap">
                        <canvas id="chart" width="220" height="220" role="img" aria-label="Spending by category chart"></canvas>
                        <ul id="legend" class="legend"></ul>
                    </div>
                </section>
            </div>

            <!-- Right column: the list of transactions. -->
            <section class="panel">
                <div class="list-head">
                    <h2>Transactions</h2>
                    <select id="filter" aria-label="Show">
                        <option value="all">All</option>
                        <option value="income">Income</option>
                        <option value="expense">Expenses</option>
                    </select>
                </div>
                <ul id="list" class="list"></ul>
                <p id="empty" class="empty">No transactions this month.</p>

                <div class="tools">
                    <button id="sample" type="button" class="link">Add sample data</button>
                    <button id="export" type="button" class="link">Export CSV</button>
                    <button id="clear" type="button" class="link danger">Delete month</button>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
