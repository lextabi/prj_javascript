<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <!-- A tiny inline SVG icon for the browser tab, so no image file is needed. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>📋 Kanban</h1>
        <label class="search">
            <span class="visually-hidden">Search cards</span>
            <input id="search" type="search" placeholder="Search cards…">
        </label>
    </header>

    <!-- The columns and cards are drawn by js/view.js from the Board object. -->
    <main id="board" class="board" aria-label="Kanban board"></main>

    <p class="help">
        Drag cards between columns · Double-click a card to rename it · Click the colored tag to change priority ·
        Keyboard: focus a card and press <kbd>Alt</kbd> + <kbd>←</kbd> <kbd>→</kbd> to move it between columns,
        <kbd>Alt</kbd> + <kbd>↑</kbd> <kbd>↓</kbd> to reorder, <kbd>Enter</kbd> to rename
    </p>

    <!-- type="module" turns on ES modules: this file can import code from other files,
         and the browser loads the whole import tree for us. Modules are also deferred
         automatically, so the HTML above is ready before the code runs. -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
