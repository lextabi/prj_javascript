<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <!-- A tiny inline SVG icon for the browser tab, so no image file is needed. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <h1>Tip Calculator</h1>

        <!-- The left side: everything the user types or picks. -->
        <section class="inputs">
            <!-- "for" links the label to the input with the same id, so clicking the label focuses the box. -->
            <div class="field">
                <div class="field-head">
                    <label for="bill">Bill</label>
                    <!-- Error messages start empty. JavaScript fills them in. -->
                    <span id="bill-error" class="error" aria-live="polite"></span>
                </div>
                <!-- inputmode="decimal" shows a number keyboard with a dot on phones. -->
                <input id="bill" class="input input-money" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
            </div>

            <div class="field">
                <span class="label">Select tip %</span>
                <!-- data-tip holds the percentage for each button. JavaScript reads it with dataset.tip. -->
                <div id="tips" class="tip-grid">
                    <button type="button" class="tip-btn" data-tip="5">5%</button>
                    <button type="button" class="tip-btn" data-tip="10">10%</button>
                    <button type="button" class="tip-btn active" data-tip="15">15%</button>
                    <button type="button" class="tip-btn" data-tip="18">18%</button>
                    <button type="button" class="tip-btn" data-tip="20">20%</button>
                    <input id="custom-tip" class="input tip-custom" type="number" min="0" max="100" placeholder="Custom" aria-label="Custom tip percent">
                </div>
            </div>

            <div class="field">
                <div class="field-head">
                    <label for="people">Number of people</label>
                    <span id="people-error" class="error" aria-live="polite"></span>
                </div>
                <div class="stepper">
                    <button type="button" id="people-minus" class="step-btn" aria-label="Fewer people">−</button>
                    <input id="people" class="input" type="number" min="1" step="1" value="1" inputmode="numeric">
                    <button type="button" id="people-plus" class="step-btn" aria-label="More people">+</button>
                </div>
            </div>

            <label class="check">
                <input id="round-up" type="checkbox">
                Round each person's total up to a whole amount
            </label>
        </section>

        <!-- The right side: the results. -->
        <section class="results" aria-live="polite">
            <div class="row">
                <p>Tip <small>/ person</small></p>
                <p id="tip-per-person" class="amount">$0.00</p>
            </div>
            <div class="row">
                <p>Total <small>/ person</small></p>
                <p id="total-per-person" class="amount">$0.00</p>
            </div>
            <div class="row row-small">
                <p>Whole bill with tip</p>
                <p id="grand-total">$0.00</p>
            </div>
            <button type="button" id="reset" class="reset" disabled>Reset</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
